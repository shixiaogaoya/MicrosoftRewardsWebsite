<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Rewards 助手界面结构示意</title><desc id="desc">主界面只保留开始停止、自动开关和折叠设置。此图是结构示意，不是实机截图。</desc>
<defs><linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#f4f8f8"/><stop offset="1" stop-color="#eaf2f0"/></linearGradient></defs>
<rect width="1200" height="700" rx="22" fill="url(#canvas)"/>
<g font-family="'Segoe UI','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<text x="52" y="62" font-size="27" font-weight="700" fill="#163445">把常用操作留在眼前</text>
<text x="52" y="93" font-size="15" fill="#637e89">界面结构示意 · 非实机截图</text>
<g transform="translate(52 165)">
<circle cx="15" cy="0" r="15" fill="#2282ad"/><text x="15" y="5" text-anchor="middle" font-size="14" fill="white" font-weight="700">1</text>
<text x="43" y="7" fill="#173e4b" font-size="21" font-weight="700">一个主按钮</text><text x="43" y="38" fill="#647d86" font-size="16">开始本轮任务，运行中切换为停止。</text>
<circle cx="15" cy="133" r="15" fill="#2282ad"/><text x="15" y="138" text-anchor="middle" font-size="14" fill="white" font-weight="700">2</text>
<text x="43" y="140" fill="#173e4b" font-size="21" font-weight="700">一个自动开关</text><text x="43" y="171" fill="#647d86" font-size="16">关闭自动，仍然可以手动开始。</text>
<circle cx="15" cy="266" r="15" fill="#2282ad"/><text x="15" y="271" text-anchor="middle" font-size="14" fill="white" font-weight="700">3</text>
<text x="43" y="273" fill="#173e4b" font-size="21" font-weight="700">低频选项折叠</text><text x="43" y="304" fill="#647d86" font-size="16">次数、间隔和任务内容，按需调整。</text>
</g>
<g transform="translate(458 141)">
<rect x="7" y="10" width="320" height="350" rx="16" fill="#153d49" opacity=".08"/>
<rect width="320" height="350" rx="16" fill="#f4f7f6" stroke="#d3e0de"/>
<rect x="0" y="0" width="320" height="35" rx="16" fill="#e4edeb"/><path d="M0 19v16h320V19" fill="#e4edeb"/>
<circle cx="19" cy="18" r="3" fill="#92aaa8"/><circle cx="31" cy="18" r="3" fill="#92aaa8"/><circle cx="43" cy="18" r="3" fill="#92aaa8"/>
<text x="160" y="77" text-anchor="middle" fill="#1a6f8c" font-size="22" font-weight="700">Rewards 助手</text>
<text x="160" y="107" text-anchor="middle" fill="#18272f" font-size="15">准备就绪</text>
<rect x="22" y="130" width="276" height="46" rx="7" fill="#2282ad"/><text x="160" y="159" text-anchor="middle" fill="white" font-size="18" font-weight="700">开始任务</text>
<rect x="24" y="207" width="32" height="18" rx="9" fill="#2282ad"/><circle cx="47" cy="216" r="6" fill="white"/>
<text x="68" y="221" fill="#18272f" font-size="16">每日自动执行</text>
<text x="25" y="265" fill="#1a6f8c" font-size="16">▸ 高级设置</text>
<path d="M23 289H297" stroke="#dae5e2"/>
<text x="24" y="321" fill="#1a6f8c" font-size="15">打开 Rewards</text><text x="296" y="321" text-anchor="end" fill="#1a6f8c" font-size="15">帮助</text>
</g>
<g transform="translate(842 172)">
<rect width="306" height="329" rx="14" fill="white" stroke="#d5e2df"/>
<text x="23" y="38" fill="#163f4c" font-size="19" font-weight="700">高级设置 · 按需展开</text>
<path d="M23 57H283" stroke="#e6edeb"/>
<text x="23" y="92" fill="#56727d" font-size="16">执行搜索 / 每日活动 / 领取积分</text>
<text x="23" y="133" fill="#56727d" font-size="16">搜索次数、间隔、关闭时间</text>
<text x="23" y="174" fill="#56727d" font-size="16">账号等级预设</text>
<text x="23" y="215" fill="#56727d" font-size="16">是否打开首个搜索结果</text>
<rect x="20" y="249" width="266" height="58" rx="8" fill="#f0f6f4"/>
<text x="153" y="274" text-anchor="middle" fill="#315c64" font-size="14">默认：5 次搜索 · 60 秒间隔</text><text x="153" y="294" text-anchor="middle" fill="#6c858a" font-size="13">有效参数在每轮开始时固定</text>
</g>
<path d="M787 404h38" stroke="#a6bfbe" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="52" y="575" width="1096" height="72" rx="12" fill="#dfede8"/>
<circle cx="82" cy="611" r="13" fill="#2f8069"/><path d="m76 611 4 4 8-9" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="108" y="605" fill="#285749" font-size="17" font-weight="700">已发起搜索 ≠ 积分到账</text>
<text x="108" y="630" fill="#54776a" font-size="14">运行时会显示搜索进度与任务结果；无法核对页面结果时，保持“结果待确认”。</text>
</g></svg>
