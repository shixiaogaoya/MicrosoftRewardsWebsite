name: 在线构建扩展（可能创建 Release）

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 对 master 当前版本检查和打包，创建或复用同一提交的正式 Release，自动上传 Chrome 商店并提审
        type: boolean
        required: true
        default: false
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    # Single verification round per commit: this workflow is the only verifier
    # for master pushes (ci.yml only runs its extension job on pull requests)
    # and for tag/manual runs, which have no ci.yml backing at all. Typecheck
    # and tests run once, then both browser targets are packaged sequentially;
    # `wxt zip` builds before zipping, so each target is still fully built.
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: wxt

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: 验证发布与商店提审脚本（模拟，不访问外部服务）
        shell: bash
        working-directory: .
        run: |
          bash .github/scripts/publish-release.test.sh
          bash .github/scripts/publish-cws.test.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wxt/package-lock.json

      - run: npm ci
      - run: npm run compile
      - run: npm run test
      # Both targets are packaged: the Chrome (MV3) and Firefox (MV2) outputs
      # differ enough that one passing does not imply the other does.
      - run: npm run zip
      - run: npm run zip:firefox

      - uses: actions/upload-artifact@v7
        with:
          name: extension-chrome
          path: wxt/dist/*-chrome.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: extension-firefox
          path: wxt/dist/*-firefox.zip
          if-no-files-found: error

  release:
    name: 发布到 Releases
    needs: build
    outputs:
      store_release_tag: ${{ steps.publish.outputs.store_release_tag }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      # The Release notes list merged PRs to attribute entries; without this
      # scope gh pr list fails and the publish aborts before creating the
      # Release.
      pull-requests: read
    concurrency:
      # One publisher at a time. The version is only known after checkout, and
      # cancelling an in-flight publish could leave a tag without its Release.
      group: rewards-release-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BUILD_SHA: ${{ github.sha }}
      CONFIRM_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_release == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: 下载本次构建的扩展 ZIP
        run: gh run download "$GITHUB_RUN_ID" --pattern 'extension-*' --dir artifacts

      - name: 创建版本并上传扩展 ZIP
        id: publish
        shell: bash
        run: bash .github/scripts/publish-release.sh

  store:
    name: 提交 Chrome 商店审核
    needs: release
    if: github.ref == 'refs/heads/master' && needs.release.outputs.store_release_tag != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-cws.yml
    with:
      mode: submit
      release_tag: ${{ needs.release.outputs.store_release_tag }}
