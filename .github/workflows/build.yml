name: 在线构建扩展（可能创建 Release）

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 对 master 当前版本检查和打包；若正式 Release 尚不存在，将创建标签和 Release，并提交 Chrome 商店审核
        type: boolean
        required: true
        default: false
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - browser: chrome
            script: zip
          - browser: firefox
            script: zip:firefox

    defaults:
      run:
        working-directory: wxt

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run compile
      - run: npm run test
      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v7
        with:
          name: extension-${{ matrix.browser }}
          path: wxt/dist/*.zip
          if-no-files-found: error

  release:
    name: 发布到 Releases
    needs: build
    outputs:
      store_release_tag: ${{ steps.publish.outputs.store_release_tag }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      # One publisher at a time. The version is only known after checkout, and
      # cancelling an in-flight publish could leave a tag without its Release.
      group: rewards-release-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BUILD_SHA: ${{ github.sha }}
      CONFIRM_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_release == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: 下载本次构建的扩展 ZIP
        run: gh run download "$GITHUB_RUN_ID" --pattern 'extension-*' --dir artifacts

      - name: 创建版本并上传扩展 ZIP
        id: publish
        shell: bash
        run: bash .github/scripts/publish-release.sh

  store:
    name: 提交 Chrome 商店审核
    needs: release
    if: github.ref == 'refs/heads/master' && needs.release.outputs.store_release_tag != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-cws.yml
    with:
      mode: submit
      release_tag: ${{ needs.release.outputs.store_release_tag }}
