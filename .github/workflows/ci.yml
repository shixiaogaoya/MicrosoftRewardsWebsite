name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  extension:
    name: Extension — typecheck + test + build
    # Pull requests have no build.yml run, so they get the full dual-target
    # verification here. master pushes are verified once by build.yml, which
    # runs the same script fixtures, compile, tests, and the real zips.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wxt
    steps:
      - uses: actions/checkout@v4
      - name: 验证发布与商店提审脚本（模拟，不访问外部服务）
        shell: bash
        working-directory: .
        run: |
          bash .github/scripts/publish-release.test.sh
          bash .github/scripts/publish-cws.test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wxt/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm run test
      # Both targets are built: the Chrome (MV3) and Firefox outputs differ
      # enough that one passing does not imply the other does.
      - run: npm run build
      - run: npm run build:firefox

  mobile:
    name: Flutter — analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microsoft_rewards_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # 2026-11: this job is now blocking. The previously reported analyze
      # issues are fixed, flutter_lints + lints are resolved dependencies
      # (real pub.dev sha256 checksums in pubspec.lock), the cancellation-path
      # tests pass, and a real CI run has confirmed flutter analyze and
      # flutter test green — continue-on-error is removed.
      - run: flutter analyze
      - run: flutter test
